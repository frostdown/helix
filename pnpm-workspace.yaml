packages:
  - "apps/*"
  - "packages/*"

# Don't auto-run `pnpm install` before every `pnpm <script>` invocation.
# pnpm's deps-status check (runDepsStatusCheck) reinstalls when it thinks
# node_modules is stale. The five `pnpm dev:*` VS Code tasks launch in parallel,
# so each would fire its own install at once — and the portal postinstall
# (`prisma generate`) would race several copies of itself into one output dir,
# leaving a partial client and failing the others. Deps are installed once by
# .devcontainer/post-create.sh; run `pnpm install` explicitly after dep changes.
verifyDepsBeforeRun: false

# esbuild (via tsx + vitest) links a native binary in its install script.
# prisma fetches its CLI engine artifacts on install.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true

# Force-patch transitive deps that no workspace package declares, so `pnpm
# update` cannot reach them in-range. Drop an entry once every parent's own
# range has moved past it.
#   brace-expansion — GHSA DoS via exponential-time expansion of consecutive
#   non-expanding {} groups; minimatch allows ^5.0.5, we need >= 5.0.7.
#   deepmerge-ts — GHSA-ggr8-5vv4-36mx stack exhaustion on recursive object
#   graphs, fixed in 8.0.0. @prisma/config exact-pins 7.1.5, so no `pnpm
#   update` can reach it; it is CLI-only (loadConfigTsOrJs merges our own
#   prisma.config.ts), never loaded by a running service. v8 keeps the
#   `deepmerge` export @prisma/config passes to c12 as its `merger`.
overrides:
  brace-expansion: ^5.0.9
  deepmerge-ts: ^8.0.1

# Single-source dependency versions across the monorepo (pnpm catalog).
# Packages reference these with "catalog:" instead of pinning their own range,
# so a bump happens in exactly one place. https://pnpm.io/catalogs
catalog:
  # ── Runtime ──
  fastify: ^5.12.0
  zod: ^4.4.3
  "@fastify/multipart": ^10.0.0 # bundle upload (M1)
  # Registry persistence — portal only (the edge stays dependency-minimal and
  # hand-writes SQL; project plan §1, §6). Prisma 7 is Rust-engine-free and
  # needs a driver adapter (pg) passed to PrismaClient.
  "@prisma/client": ^7.9.1
  "@prisma/adapter-pg": ^7.9.1
  pg: ^8.21.0
  # Blob storage (Azurite in dev, Azure Blob in prod) — portal only.
  "@azure/storage-blob": ^12.32.0
  # Managed-identity credential for portal blob writes (prod) — portal only,
  # never the dep-minimal edge, which fetches its own AAD token over undici.
  "@azure/identity": ^4.5.0
  # Edge HTTP client: streams assets from Blob with hand-rolled SharedKey
  # signing — the edge stays off the Azure SDK (dep-minimal, project plan §1).
  undici: ^7.29.0
  # Zip handling: yauzl reads (portal, streaming + zip-bomb-safe), archiver
  # writes (helix CLI). fflate reads + writes in the browser (portal-web bundle
  # salvage — ADR-0038): tiny, dependency-free, and can list a zip's central
  # directory without inflating it (so a node_modules zip can't OOM the tab).
  yauzl: ^3.4.0
  archiver: ^8.0.0
  fflate: ^0.8.2
  fastify-plugin: ^6.0.0
  # ── Observability (ADR-0037) ──
  # OTel API + SDK. @azx-pbc/telemetry owns every SDK import (only the three
  # server.ts boot seams pull it in); buildApp()-and-below in all three
  # services only ever imports the dependency-free @opentelemetry/api facade.
  # No vendor SDK (applicationinsights, @azure/monitor-*) and no
  # auto-instrumentation package — ADR-0037 decisions 1 and 4 reject both
  # outright, permanently.
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/resources": ^2.10.0
  "@opentelemetry/sdk-trace-node": ^2.10.0
  "@opentelemetry/sdk-metrics": ^2.10.0
  "@opentelemetry/semantic-conventions": ^1.43.0
  # Exporters track OTel's own slower-graduating pre-1.0 line (normal for this
  # ecosystem); still peer-compatible with the api/sdk pins above.
  "@opentelemetry/exporter-trace-otlp-http": ^0.221.0
  "@opentelemetry/exporter-metrics-otlp-http": ^0.221.0
  # ── Auth (M3) ──
  # jose + openid-client are the edge's two allowed auth additions (project
  # plan §1); jose also verifies portal bearer tokens, openid-client also
  # drives the CLI device flow. oidc-provider is the local dev IdP
  # (apps/dev-idp, never deployed — project plan §3, Entra row).
  jose: ^6.2.3
  openid-client: ^6.8.4
  oidc-provider: ^9.11.3
  # ── Portal SPA (apps/portal-web) ──
  # Mantine 9 pins React 19. Vite stays on the 7.x line (vitest 4 supports it;
  # 8.x is the rolldown major — adopt as its own bump). Fonts are self-hosted
  # via fontsource: no CDN fetches from the control plane.
  react: ^19.2.7
  react-dom: ^19.2.7
  "@mantine/core": ^9.5.1
  "@mantine/hooks": ^9.5.1
  "@mantine/dropzone": ^9.5.1
  "@mantine/charts": ^9.5.1 # usage charts (wraps recharts); SPA-only, not the edge
  recharts: ^3.2.1 # @mantine/charts peer
  "@tanstack/react-query": ^5.101.0
  react-router: ^7.18.2 # library mode (BrowserRouter) — no framework runtime
  "@fontsource-variable/space-grotesk": ^5.2.10
  "@fontsource-variable/hanken-grotesk": ^5.2.8
  "@fontsource-variable/jetbrains-mono": ^5.2.8
  # Portal serves the built SPA statically (project plan §1).
  "@fastify/static": ^10.1.2
  # ── Dev tooling ──
  "@eslint/js": ^10.0.1
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  # The root package.json declares vite off this entry even though only the SPA
  # imports it: vitest takes vite as an auto-installed peer over `^6 || ^7 || ^8`,
  # so with nothing declaring it there it resolved its own 8.x and ran the SPA
  # suite through the rolldown major while `vite build` used 7.x. That mismatch
  # is what put "`esbuild` option ... use `oxc` instead" on every `pnpm test` —
  # vite 8 deprecates options @vitejs/plugin-react 5 still sets. Keep it declared
  # so runner and build share one copy.
  vite: ^7.3.6
  "@vitejs/plugin-react": ^5.2.0 # v6 peers on vite ^8 — moves with the rolldown bump
  postcss: ^8.5.23
  postcss-preset-mantine: ^1.18.0
  postcss-simple-vars: ^7.0.1
  jsdom: ^29.1.1
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.1
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.6.0
  "@types/node": ^24.13.2 # track the Node 24 LTS runtime, not the odd/current 25.x line
  "@types/pg": ^8.20.0
  "@types/yauzl": ^3.3.0
  "@types/archiver": ^8.0.0
  "@types/oidc-provider": ^9.5.0
  prisma: ^7.9.1
  form-data: ^4.0.6 # build multipart bodies in app.inject tests
  eslint: ^10.4.1
  prettier: ^3.8.4
  # Bundles the helix CLI to a single publishable dist/helix.js — the one place
  # we emit JS. Lets @azx-pbc/shared stay a build-free raw-TS workspace package
  # (its `exports` point at ./src) without leaking `workspace:*` into a
  # published manifest.
  esbuild: ^0.28.2
  tsx: ^4.22.4
  typescript: ^6.0.3
  typescript-eslint: ^8.61.0
  vitest: ^4.1.8
